name: Testes e pré-publicação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar o projeto e dependências de teste
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,auth]"
      - name: Testar
        run: python -m pytest -q
      - name: Verificar arquivos públicos
        run: python scripts/check_publication.py
